<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeadlineOS · Countdown Lock-Screen Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand"><div class="logo"><i></i></div>DeadlineOS</div>
  <div class="chip"><b></b>Live countdown</div>
</header>

<main class="grid">
  <div class="col">
    <section class="panel">
      <h2>Mission countdown</h2>
      <div class="goal" id="goalView"></div>
      <div class="cd">
        <div class="cell"><strong id="d">0</strong><span>Days</span></div>
        <div class="cell"><strong id="h">00</strong><span>Hours</span></div>
        <div class="cell"><strong id="m">00</strong><span>Minutes</span></div>
        <div class="cell"><strong id="s">00</strong><span>Seconds</span></div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="meta"><span id="dlText"></span><span id="pct"></span></div>
      <div class="done-banner" id="banner">Deadline reached. Set a new goal below.</div>
    </section>

    <section class="panel">
      <h2>Customize</h2>
      <div class="row">
        <div><label for="goal">Goal title</label><input type="text" id="goal" maxlength="60"></div>
        <div><label for="dead">Deadline</label><input type="datetime-local" id="dead"></div>
      </div>
      <div class="themes"><span>Wallpaper theme</span><div id="themes" style="display:flex;gap:10px"></div></div>
    </section>

    <section class="panel">
      <h2>Weekly milestones <span id="msCount"></span></h2>
      <ul class="list" id="ms"></ul>
      <form class="add" id="msForm"><input type="text" id="msIn" placeholder="Add a weekly milestone" maxlength="70"><button class="btn" type="submit">Add</button></form>
    </section>

    <section class="panel">
      <h2>Daily checklist <span id="tkCount"></span></h2>
      <ul class="list" id="tk"></ul>
      <form class="add" id="tkForm"><input type="text" id="tkIn" placeholder="Add a daily task" maxlength="50"><button class="btn" type="submit">Add</button></form>
    </section>
  </div>

  <aside class="phone-col">
    <div class="phone">
      <div class="screen">
        <canvas id="cv" width="1080" height="1920"></canvas>
        <div class="notch"></div>
        <div class="clock"><small id="cDate"></small><b id="cTime"></b></div>
      </div>
    </div>
    <div class="dl">
      <button class="btn" id="download">Download wallpaper (PNG)</button>
      <p>Exports 1080 × 1920 · The clock area is left clear for your phone’s own lock-screen clock.</p>
    </div>
  </aside>
</main>

<script src="js/script.js"></script>
</body>
</html>
